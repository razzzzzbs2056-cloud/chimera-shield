# Paper trading (dry run) by default. Copy config-private.example.json to
# config-private.json and replace every REPLACE value before starting.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.10
    restart: unless-stopped
    container_name: chimera-freqtrade
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./config.json:/freqtrade/config.json:ro
      - ./config-private.json:/freqtrade/config-private.json:ro
    ports:
      - "127.0.0.1:8080:8080"   # web UI, this computer only
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/config.json
      --config /freqtrade/config-private.json
      --strategy ChimeraRule
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
