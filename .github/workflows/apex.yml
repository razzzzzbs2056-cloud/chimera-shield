name: Apex

on:
  push:
    paths: ['apex/**', '.github/workflows/apex.yml']
  pull_request:
    paths: ['apex/**', '.github/workflows/apex.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in apex/js/core/*.js apex/js/modules/*.js apex/sw.js apex/mcp/*.mjs apex/tests/*.mjs; do node --check "$f"; done
      - name: MCP server test
        run: node apex/tests/mcp.test.mjs
      - name: Install Playwright
        run: npm install -g playwright@1.56.1 && npx -y playwright@1.56.1 install --with-deps chromium
      - name: Smoke test (all trackers, desktop + mobile)
        run: node apex/tests/smoke.mjs
