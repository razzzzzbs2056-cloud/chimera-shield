# Local stack for the Glacier Intelligence Platform.
#   db     : PostgreSQL + PostGIS (schema in backend/app/db/schema.sql)
#   redis  : broker/cache for the Celery imagery/DEM workers
#   api    : FastAPI backend (runs without db for evaluation; uses it in prod)
#   web    : Next.js command-center frontend
#
# The API and pure-compute engines run without the database; the db/redis
# services are for the persistence + worker path described in the docs.
version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: glacier
      POSTGRES_PASSWORD: glacier
      POSTGRES_DB: glacier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glacier"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://glacier:glacier@db:5432/glacier
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
