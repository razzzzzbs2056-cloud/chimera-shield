     bt_spread_bps: 1.0, bt_depth_usd: 236000, research: "neutral: buybacks vs team unlock overhang"}
  - {id: aave-long, base: AAVE, symbol: AAVE/USDT, market: spot, bias: long,
     bt_spread_bps: 2.4, bt_depth_usd: 105000, research: "neutral, leaning long: cheap but buyback paused"}
  - {id: sky-long, base: SKY, symbol: SKY/USDT, market: spot, bias: long, invalidation_price: 0.0358,
     bt_spread_bps: 9.8, bt_depth_usd: 16000, research: "neutral, leaning avoid: TVL and revenue shrinking"}
  - {id: uni-long, base: UNI, symbol: UNI/USDT, market: spot, bias: long,
