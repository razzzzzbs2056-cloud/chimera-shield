# Trading agent configuration. No secrets here: keys come from the environment (.env.example).
mode: paper            # paper | testnet | live. Live also needs explicit approval (docs/RUNBOOK.md).
exchange: okx
timeframe: 1h
paper_balance: 1000
context_symbol: BTC/USDT
data_dir: var
max_book_age_s: 15
max_clock_skew_s: 2.0

reflex:
  kind: rule           # rule | haiku. haiku needs ANTHROPIC_API_KEY. Jev: blocked, see PROGRESS.md.
  latency_budget_s: 5  # a decision slower than this is discarded and the candle is skipped

limits:                # hard risk layer; no model can change these
  risk_per_trade: 0.02
  max_daily_loss: 0.05
  max_open_positions: 3
  max_leverage: 2.0
  kill_drawdown: 0.15
  max_position_frac: 1.0

costs:                 # OKX base-tier taker fees (assumption: no fee discounts)
  spot: {taker_fee: 0.001, slippage_bps: 2}
  swap: {taker_fee: 0.0005, slippage_bps: 2}

# Off-limits coins. A setup naming any of these fails config validation.
denylist:
  memecoins: [DOGE, SHIB, PEPE, WIF, BONK, FLOKI, TRUMP, FARTCOIN, PENGU, BRETT, MEME, M, PUMP, SPX, MOG]
  privacy: [XMR, ZEC, DASH, BDX, SCRT, ZEN]
  stock_tokens: [TSLAX, NVDAX, AAPLX, SPYX, QQQX, COINX, MSTRX, GOOGLX, METAX, AMZNX, HOODX, CRCLX]

# Finalists from docs/RESEARCH.md (2026-11-10). bt_* are backtest assumptions measured on
# OKX on 2026-11-10 and applied to all history. Longs trade spot; shorts trade the perp.
setups:
