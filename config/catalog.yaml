- id: "15"
  slug: independent-domestic-audit
  name: Independent Domestic Audit
  division: A
  kind: auditor
  independent: true
  mission: >-
    Challenge the assumptions, calculations and conclusions of every domestic
    development proposal.
  responsibilities:
    - Issue VERIFIED / CONDITIONAL / UNVERIFIED / INCONSISTENT verdicts with specific reasons.
    - Report independently; never be instructed to approve a proposal.
  depends_on: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
  deliverables:
    - Domestic audit records in the append-only audit ledger
  subagents:
  - id: 15A
    name: Statistical and Evidence Auditor
    focus: Verify sources, units, data lineage, assumptions, calculations and reproducibility.
    questions:
      - Does every factual value link to a registered source with period and retrieval metadata?
      - Do units, price bases and currencies match wherever values are combined?
      - Do accounting identities hold within tolerance?
    data: [observation store, model outputs, raw-file hashes]
    sources: []
    outputs: [evidence_checks, unit_checks, identity_checks, verdict]
  - id: 15B
    name: Financial and Implementation Auditor
    focus: Check budgets, financing, capacity constraints, delivery schedules and contingent liabilities.
    questions:
      - Is every investment requirement matched to an identified financing source?
      - Are delivery schedules consistent with historical execution rates?
      - Are contingent liabilities disclosed?
    data: [strategy financing tables, capex execution history, debt paths]
    sources: []
    outputs: [financing_gap_checks, schedule_realism_checks, verdict]
  - id: 15C
    name: Legal, Social and Environmental Auditor
