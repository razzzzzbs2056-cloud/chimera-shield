# NEPAL 3T — canonical agent catalog (single source of truth)
#
# Edit THIS file, then run:  python -m src.cli generate
# That regenerates config/agents.json, config/subagents.json,
# .claude/agents/*.md and src/agents/specs/*.md. Tests fail if the
# generated files drift from this catalog.
#
# depends_on entries may be an agent id ("01") — meaning every subagent of
# that agent — or a subagent id ("16A"). Subagents inherit their agent's
# depends_on and may add their own via `extra_depends_on`.
#
# `sources` refer to ids in research/sources/source_catalog.yaml.

version: "1.0"
platform: NEPAL 3T
divisions:
  A: National Strategy and Domestic Economy
  B: Global Geopolitical Intelligence

agents:

# ======================================================================
# DIVISION A — NATIONAL STRATEGY AND DOMESTIC ECONOMY
# ======================================================================

- id: "00"
  slug: national-orchestrator
  name: National Orchestrator
  division: A
  kind: orchestrator
  mission: >-
    Coordinate the entire platform, assign research, manage shared assumptions,
    combine specialist findings and prepare auditable national scenarios.
  responsibilities:
    - Maintain the task graph, shared assumption register and run state.
    - Assign scoped tasks with acceptance criteria to agents 01-28.
    - Integrate only audited outputs into national scenarios.
    - Never alter findings issued by Agent 15 or Agent 28.
  depends_on: []
  deliverables:
    - Task graph and run plan (state/run_state.json)
    - Shared assumption register (config/model_config.yaml, versioned)
    - Integrated national scenario packages with audit status attached
  subagents:
  - id: 00A
    name: Task Decomposition
    focus: Convert broad goals into specific assignments, dependencies, deliverables and acceptance criteria.
    questions:
      - Which research questions must be answered before the US$3T arithmetic can be evaluated?
      - What is the minimal dependency-ordered task set for each phase of the roadmap?
      - What objective acceptance criterion closes each task?
    data: [agent catalog, roadmap phases, open data-gap register]
    sources: []
    outputs: [task_list, dependency_edges, acceptance_criteria]
  - id: 00B
    name: Inter-Agent Coordination
    focus: Coordinate parallel research, resolve data inconsistencies and escalate unresolved methodological disputes.
    questions:
      - Which agents report conflicting values for the same variable and period?
      - Is each conflict a definitional, vintage, coverage or methodological difference?
      - Which disputes require escalation to a human reviewer?
    data: [observation store, assumption register, audit ledger]
    sources: []
    outputs: [conflict_register, escalations, resolution_notes]
  - id: 00C
    name: National Scenario Integration
    focus: Combine independently verified sector results into consistent national projections without double-counting.
    extra_depends_on: ["15", "28"]
    questions:
      - Do integrated sector value-added figures sum to GDP at basic prices without overlap?
      - Are real growth, deflator and exchange-rate paths kept separate and consistent?
      - Which inputs remain CONDITIONAL or UNVERIFIED and how do they propagate?
    data: [audited sector outputs, shared model state, audit verdicts]
    sources: []
    outputs: [integrated_scenario, identity_check_results, audit_status_by_input]

- id: "01"
  slug: macroeconomic-strategy
  name: Macroeconomic Strategy
  division: A
  kind: specialist
  mission: >-
    Investigate Nepal's long-term growth potential, macroeconomic constraints and
    the feasibility of the US$3 trillion target.
  responsibilities:
    - Build and maintain growth-accounting and projection modules.
    - Produce the US$3T required-growth arithmetic under multiple timelines.
    - Identify conditions under which the target is unattainable.
  depends_on: []
  deliverables:
    - Growth-accounting decomposition (historical, sourced)
    - Required-trajectory tables for 2050/2060/2070 and an untargeted baseline
    - Feasibility assessment with explicit failure conditions
  subagents:
  - id: 01A
    name: Macroeconomic Modeller
    focus: Research and model GDP, productivity, capital accumulation, labour supply and structural change.
    extra_depends_on: [10B, 10C]
    questions:
      - What is the historical decomposition of real GDP growth into capital, labour and TFP?
      - What investment rate and ICOR are implied by recent official national accounts?
      - How has sectoral employment and value-added share shifted since the 2010s?
    data: [real GDP (NPR constant prices), gross fixed capital formation, employment by sector, GVA by sector, labour share]
    sources: [nso_nepal, mof_nepal, wb_wdi, imf_weo, pwt, ilostat]
    outputs: [growth_accounting_table, investment_rate_series, icor_estimate, structural_change_table]
  - id: 01B
    name: International Growth Researcher
    focus: Study historical transformations in relevant economies. Assess which lessons transfer to Nepal and which do not.
    questions:
      - Which economies sustained high real growth for 25+ years, and from what starting income?
      - What preconditions (sea access, institutions, savings, energy) accompanied them?
      - Which of those preconditions are absent or structurally different in Nepal?
    data: [long-run GDP per capita panels, growth-spell durations, investment rates, export shares]
    sources: [maddison, pwt, wb_wdi, academic]
    outputs: [comparator_set, growth_spell_statistics, transferability_assessment]
  - id: 01C
    name: Long-Term Scenario Forecaster
    focus: Construct alternative GDP and GDP-per-capita trajectories with explicit real growth, inflation, exchange-rate and demographic assumptions.
    extra_depends_on: [01A, 01B, 03A, 05A, 06C, 07A, 08A, 09A, 10C, 12A, 16C]
    questions:
      - What nominal USD GDP results from each explicit (real growth, deflator, NPR/USD, population) path?
      - What real growth is required to reach US$3T by 2050, 2060 and 2070 under stated price/FX assumptions?
      - How sensitive is the answer to the exchange-rate and deflator assumptions?
    data: [base-year nominal GDP, GDP deflator, NPR/USD, INR/USD, population projections]
    sources: [nso_nepal, nrb, imf_weo, un_wpp]
    outputs: [trajectory_table, required_growth_table, sensitivity_grid]

- id: "02"
  slug: public-finance
  name: Public Finance
  division: A
  kind: specialist
  mission: >-
    Examine how Nepal could finance development without creating unsustainable
    fiscal obligations.
  responsibilities:
    - Model revenue capacity, spending efficiency and debt dynamics.
    - Test the fiscal cost of every strategy against sustainability thresholds.
  depends_on: ["11"]
  deliverables:
    - Fiscal baseline (revenue, expenditure, debt; sourced)
    - Debt-sustainability simulations per strategy
  subagents:
  - id: 02A
    name: Revenue and Tax Researcher
    focus: Investigate tax structure, revenue capacity, compliance, informality and the distributional effects of alternative tax policies.
    questions:
      - What is the composition of federal revenue by tax type, and its trend?
      - How dependent is revenue on import-based taxes (customs, VAT at border)?
      - What are the documented distributional effects of the main taxes?
    data: [revenue by tax head, tax-to-GDP ratio, import-related revenue share, VAT gap estimates]
    sources: [mof_nepal, imf_article_iv, wb_npl, customs_nepal]
    outputs: [revenue_composition_table, import_tax_dependence, distributional_notes]
  - id: 02B
    name: Public Expenditure Researcher
    focus: Examine spending efficiency, government procurement, investment execution and public-service outcomes.
    questions:
      - What share of budgeted capital expenditure is executed each fiscal year?
      - How is capital spending concentrated in the final months of the fiscal year?
      - What do audit reports identify as the main execution failures?
    data: [capital budget vs actual, monthly expenditure profile, OAG findings]
    sources: [mof_nepal, oag_nepal, ppmo, wb_npl]
    outputs: [capex_execution_rate_series, execution_timing_profile, audit_findings_summary]
  - id: 02C
    name: Sovereign Debt Researcher
    focus: Model public debt, borrowing costs, contingent liabilities, debt-service capacity and infrastructure-financing alternatives.
    extra_depends_on: [01C, 02A, 02B]
    questions:
      - What is the stock and composition (domestic/external, concessional share) of public debt?
      - What primary balance stabilises debt under each growth and interest scenario?
      - Which contingent liabilities (SOEs, PPPs, guarantees) are documented?
    data: [public debt stock, effective interest rate, external debt currency composition, SOE liabilities]
    sources: [pdmo, mof_nepal, imf_article_iv, wb_ids]
    outputs: [debt_baseline, debt_stabilising_primary_balance, contingent_liability_register]

- id: "03"
  slug: monetary-banking
  name: Monetary Policy and Banking
  division: A
  kind: specialist
  mission: >-
    Research monetary stability, financial-sector capacity and Nepal's external
    financial constraints.
  responsibilities:
    - Model the NPR-INR peg, reserves and balance-of-payments transmission.
    - Assess banking-sector resilience and credit allocation.
  depends_on: ["20"]
  deliverables:
    - External-sector baseline (reserves, BoP)
    - Banking and capital-market capacity assessment
  subagents:
  - id: 03A
    name: Monetary and Exchange-Rate Analyst
    focus: Model inflation, exchange-rate arrangements, foreign reserves and balance-of-payments transmission.
    questions:
      - How does the NPR-INR peg transmit Indian inflation and INR/USD movements to Nepal?
      - How many months of imports do gross reserves cover, and how volatile is that cover?
      - What does the peg imply for any long-run NPR/USD assumption in the GDP model?
    data: [CPI, NPR/INR, NPR/USD, gross FX reserves, import bill, current account]
    sources: [nrb, imf_article_iv, rbi]
    outputs: [peg_transmission_notes, reserve_cover_series, fx_assumption_constraints]
  - id: 03B
    name: Banking and Credit Analyst
    focus: Study banking resilience, nonperforming loans, financial inclusion and productive credit allocation.
    questions:
      - What are the system NPL ratio, capital adequacy and sectoral credit concentration?
      - How much private credit flows to productive sectors versus real estate and trade?
      - What is the account-ownership and borrowing gap by province and gender?
    data: [NPL ratio, CAR, credit by sector, Findex indicators]
    sources: [nrb, wb_wdi, imf_article_iv]
    outputs: [banking_health_table, credit_allocation_table, inclusion_gaps]
  - id: 03C
    name: Capital Markets Analyst
    focus: Assess domestic savings mobilisation, capital-market development, insurance, investment instruments and financial-sector risks.
    questions:
      - What is the depth of equity, bond and insurance markets relative to GDP?
      - What instruments could mobilise domestic and diaspora savings for long-term investment?
      - What regulatory limits constrain foreign portfolio participation?
    data: [market capitalisation, bond issuance, insurance penetration, gross domestic savings]
    sources: [sebon, nrb, wb_wdi]
    outputs: [market_depth_table, savings_mobilisation_options, regulatory_constraints]

- id: "04"
  slug: domestic-geopolitical-economy
  name: Domestic Geopolitical Economy
  division: A
  kind: specialist
  mission: >-
    Study how Nepal's relations with its neighbours shape domestic economic decisions.
  responsibilities:
    - Translate verified regional facts (from Agent 17) into domestic policy constraints.
  depends_on: ["17"]
  deliverables:
    - Neighbour-dependency register with domestic policy implications
  subagents:
  - id: 04A
    name: India-Nepal Economic Relations
    focus: Study bilateral trade, transit agreements, energy links, border administration, currency exposure and infrastructure.
    questions:
      - What share of Nepal's goods trade, fuel imports and transit passes through India?
      - Which bilateral treaties and agreements govern trade, transit and power trade, and when were they last revised?
      - What are the documented border-administration costs and delays?
    data: [trade by partner, petroleum import origin, transit treaty texts, power trade volumes]
    sources: [customs_nepal, tepc, nrb, mofa_nepal, mea_india, nea]
    outputs: [india_trade_share, agreement_inventory, border_cost_evidence]
  - id: 04B
    name: China-Nepal Economic Relations
    focus: Study cross-border transport, investment, trade, tourism, infrastructure and bilateral agreements.
    questions:
      - What are the volumes and composition of trade through northern border points?
      - Which announced connectivity projects are under construction versus proposed?
      - What FDI commitments versus actual inflows are documented from China?
    data: [trade by border point, FDI commitments and inflows, project status records]
    sources: [customs_nepal, ibn, nrb, mofa_nepal]
    outputs: [northern_trade_profile, project_status_register, fdi_commitment_vs_actual]
  - id: 04C
    name: Cross-Border Policy Integration
    focus: Compare regional opportunities, diplomatic constraints, institutional responsibilities and the economic effects of existing agreements.
    extra_depends_on: [04A, 04B]
    questions:
      - Which domestic institutions hold responsibility for each cross-border agreement?
      - Where do opportunities with one neighbour conflict with commitments to the other?
      - What measurable economic effects of existing agreements are documented?
    data: [agreement inventory, institutional mandates, evaluation studies]
    sources: [mofa_nepal, npc_nepal, academic]
    outputs: [responsibility_matrix, conflict_map, documented_effects]

- id: "05"
  slug: energy-industrial-development
  name: Energy and Industrial Development
  division: A
  kind: specialist
  mission: >-
    Model the costs and benefits of expanding domestic energy availability,
    electricity exports and industrial production.
  responsibilities:
    - Maintain the electricity balance (generation, consumption, trade, losses).
    - Compare export versus domestic industrial use of electricity.
  depends_on: [22A, 22B, 22C, 22D]
  deliverables:
    - Electricity balance baseline and capacity pipeline
    - Export-versus-domestic-use opportunity-cost analysis (with Agent 22E)
  subagents:
  - id: 05A
    name: Hydropower and Electricity Researcher
    focus: Assess generation potential, project costs, seasonal output, transmission constraints and cross-border trade.
    questions:
      - What is installed capacity, annual generation and the wet/dry season gap?
      - What is the licensed and under-construction pipeline, and its historical completion rate?
      - Which transmission corridors constrain evacuation and export?
    data: [installed capacity MW, generation GWh by month, pipeline MW by status, transmission capacity]
    sources: [nea, doe_nepal, iea, cea_india]
    outputs: [electricity_balance, seasonal_profile, pipeline_completion_rate, transmission_bottlenecks]
  - id: 05B
    name: Industrial Energy Researcher
    focus: Investigate the opportunity cost of exporting electricity versus using it in Nepal for manufacturing and services.
    extra_depends_on: [22E]
    questions:
      - What is the realised export tariff versus domestic industrial tariff?
      - What is the value added per GWh in candidate domestic industries?
      - What reliability and grid investments would domestic industrial use require?
    data: [export prices, industrial tariffs, GVA per unit electricity by industry, outage statistics]
    sources: [nea, nso_nepal, academic]
    outputs: [tariff_comparison, value_added_per_gwh, reliability_requirements]
  - id: 05C
    name: Industrial Development Researcher
    focus: Study sector competitiveness, industrial clusters, production costs, supply chains and infrastructure requirements.
    questions:
      - What is manufacturing's share of GDP and employment and its trend?
      - Which sectors show revealed comparative advantage in export data?
      - What landed-cost disadvantages arise from landlocked logistics?
    data: [manufacturing GVA, manufacturing employment, export RCA, logistics costs]
    sources: [nso_nepal, unctadstat, un_comtrade, wb_lpi]
    outputs: [manufacturing_profile, rca_table, cost_disadvantage_estimates]

- id: "06"
  slug: infrastructure-urban
  name: Infrastructure and Urban Development
  division: A
  kind: specialist
  mission: >-
    Study economically justified infrastructure and the long-term spatial
    development of Nepal.
  responsibilities:
    - Provide physical, financial and delivery-capacity constraints to the shared model.
  depends_on: ["05", "13"]
  deliverables:
    - Infrastructure stock and delivery-capacity baseline
    - Project delivery constraint parameters (lags, cost overruns)
  subagents:
  - id: 06A
    name: Transport and Logistics Researcher
    focus: Examine roads, railways, aviation, border infrastructure and domestic and international transport costs.
    questions:
      - What is the strategic road network length and condition?
      - What are door-to-port transport time and cost to Kolkata/Haldia and Visakhapatnam?
      - What is the status of announced railway links?
    data: [road network statistics, freight cost per TEU, dry-port throughput, LPI scores]
    sources: [wb_lpi, wb_npl, adb_nepal, customs_nepal]
    outputs: [network_baseline, trade_cost_estimates, rail_project_status]
  - id: 06B
    name: Urban Development Researcher
    focus: Assess housing, urbanisation, land use, municipal services, congestion and provincial growth opportunities.
    questions:
      - What is the urban population share under the current municipal classification versus functional definitions?
      - What are service-coverage gaps (water, sanitation, waste) by municipality type?
      - Which secondary cities show fastest population growth?
    data: [census 2021 urban population, municipal service coverage, city growth rates]
    sources: [nso_nepal, un_wpp, wb_wdi]
    outputs: [urbanisation_profile, service_gap_table, secondary_city_growth]
  - id: 06C
    name: Infrastructure Finance and Delivery Researcher
    focus: Investigate procurement, project selection, engineering feasibility, maintenance and public-private financing.
    questions:
      - What are documented time and cost overruns on national-pride and donor-funded projects?
      - What is the maintenance funding gap?
      - What PPP frameworks exist and what is their track record?
    data: [project completion records, cost overrun data, maintenance budgets, PPP pipeline]
    sources: [oag_nepal, npc_nepal, ibn, adb_nepal]
    outputs: [delivery_lag_distribution, cost_overrun_distribution, ppp_track_record]

- id: "07"
  slug: agriculture-food-systems
  name: Agriculture and Food Systems
  division: A
  kind: specialist
  mission: >-
    Investigate how Nepal can improve agricultural productivity, food security and
    rural incomes.
  responsibilities:
    - Provide agricultural output, employment and food-import baselines.
  depends_on: ["25E"]
  deliverables:
    - Agricultural productivity baseline and constraint analysis
  subagents:
  - id: 07A
    name: Agricultural Productivity Researcher
    focus: Study irrigation, mechanisation, crop yields, climate exposure, agricultural research and farm economics.
    questions:
      - What are yields of major crops relative to regional comparators?
      - What share of cultivated land has year-round irrigation?
      - What share of employment is in agriculture versus its GVA share?
    data: [crop yields, irrigated area, agricultural employment share, agricultural GVA share]
    sources: [fao_stat, nso_nepal, ilostat]
    outputs: [yield_gap_table, irrigation_coverage, labour_productivity_gap]
  - id: 07B
    name: Agribusiness and Logistics Researcher
    focus: Assess storage, processing, cold chains, distribution, market access and agricultural exports.
    questions:
      - What are post-harvest losses for major perishables?
      - Which agricultural exports (e.g. cardamom, tea, ginger) have documented market access barriers?
      - What processing and cold-chain capacity exists?
    data: [post-harvest loss estimates, agri export values, SPS barrier records]
    sources: [fao_stat, tepc, un_comtrade]
    outputs: [loss_estimates, export_barrier_register, processing_capacity]
  - id: 07C
    name: Land and Food Security Researcher
    focus: Study land fragmentation, soil health, water availability, food imports and rural livelihood resilience.
    questions:
      - What is the average holding size and fragmentation trend?
      - What is the food import bill and cereal import dependence?
      - What share of households are food insecure by province?
    data: [agricultural census holdings, food import values, food insecurity prevalence]
    sources: [nso_nepal, fao_stat, customs_nepal]
    outputs: [land_fragmentation_profile, food_import_dependence, food_insecurity_by_province]

- id: "08"
  slug: technology-ai-digital
  name: Technology, AI and Digital Economy
  division: A
  kind: specialist
  mission: >-
    Evaluate technology as a potential contributor to domestic productivity and
    internationally competitive exports.
  responsibilities:
    - Quantify digital-service exports and their verifiable demand.
  depends_on: ["09", "24"]
  deliverables:
    - Digital economy baseline and export-demand evidence
  subagents:
  - id: 08A
    name: AI and Software Export Researcher
    focus: Identify viable digital-service markets, international competition, workforce needs and verifiable demand.
    questions:
      - What IT/ICT service export values are recorded in the balance of payments, and how much is unrecorded?
      - Which segments face displacement by AI automation versus growth?
      - What is the size of the qualified workforce?
    data: [ICT services exports, IT workforce estimates, freelance platform evidence]
    sources: [nrb, unctadstat, wb_wdi, academic]
    outputs: [ict_export_series, recording_gap_notes, segment_outlook]
  - id: 08B
    name: Digital Infrastructure and Cybersecurity Researcher
    focus: Study computing, broadband, electricity, cybersecurity, data protection and the costs of operating digital infrastructure.
    questions:
      - What are fixed and mobile broadband penetration, speeds and prices?
      - What international bandwidth routes exist and how redundant are they?
      - What cybersecurity and data-protection laws are in force?
    data: [broadband subscriptions, international bandwidth, data-centre capacity, relevant statutes]
    sources: [itu, lawcommission_nepal]
    outputs: [connectivity_baseline, route_redundancy, legal_framework_status]
  - id: 08C
    name: Startup and Digital Government Researcher
    focus: Assess entrepreneurship, commercialisation, public-service digitisation, regulatory barriers and technology adoption.
    questions:
      - What are business registration and foreign-payment barriers for startups?
      - Which public services are fully online, and what is their uptake?
      - Which regulations block cross-border digital payments?
    data: [business registration statistics, e-government indices, payment regulations]
    sources: [nrb, undesa_egov, wb_npl]
    outputs: [startup_barrier_register, egov_service_inventory, payment_constraints]

- id: "09"
  slug: education-research-talent
  name: Education, Research and Talent
  division: A
  kind: specialist
  mission: >-
    Investigate how Nepal can develop the skills and research capacity required for
    sustainable economic growth.
  responsibilities:
    - Provide human-capital stock and flow estimates to the shared model.
  depends_on: ["23"]
  deliverables:
    - Human-capital baseline (learning, completion, skills)
  subagents:
  - id: 09A
    name: School Education Researcher
    focus: Study foundational literacy, numeracy, teaching quality, completion rates and educational inequality.
    questions:
      - What do national learning assessments show for grade-level literacy and numeracy?
      - What are completion rates by level, province and gender?
      - What is learning-adjusted years of schooling?
    data: [NASA learning results, completion rates, LAYS, HCI]
    sources: [moest, unesco_uis, wb_wdi]
    outputs: [learning_outcomes_table, completion_by_group, lays_value]
  - id: 09B
    name: University and Vocational Training Researcher
    focus: Investigate workforce needs, technical training, applied research and institutional quality.
    questions:
      - What are tertiary enrolment, graduation by field and TVET capacity?
      - What is R&D expenditure as a share of GDP?
      - What employer-reported skill gaps are documented?
    data: [tertiary enrolment by field, TVET seats, R&D expenditure, enterprise surveys]
    sources: [moest, unesco_uis, wb_npl]
    outputs: [tertiary_profile, tvet_capacity, rnd_intensity]
  - id: 09C
    name: Workforce and Diaspora Knowledge Researcher
    focus: Examine skill gaps, migrant expertise, return migration and mechanisms for transferring knowledge.
    questions:
      - What skills do labour migrants acquire abroad, and are they certified on return?
      - What is the documented scale of high-skill emigration?
      - Which knowledge-transfer programmes have evaluated results?
    data: [labour permits by skill level, return migration surveys, emigration of graduates]
    sources: [dofe, nso_nepal, oecd]
    outputs: [skill_acquisition_evidence, brain_drain_indicators, programme_evaluations]

- id: "10"
  slug: health-labour-demographics
  name: Health, Labour and Demographics
  division: A
  kind: specialist
  mission: >-
    Assess the relationships among population health, employment, demographics and
    economic productivity.
  responsibilities:
    - Supply population and labour-force paths to the shared model.
  depends_on: ["23"]
  deliverables:
    - Population and labour-force baseline and projections (sourced)
  subagents:
  - id: 10A
    name: Healthcare Systems Researcher
    focus: Study preventive care, healthcare access, financing, workforce capacity and economic effects.
    questions:
      - What are out-of-pocket health expenditure shares and catastrophic spending rates?
      - What are health-workforce densities by province?
      - What does stunting prevalence imply for future labour productivity?
    data: [health expenditure, OOP share, health workers per 10k, stunting prevalence]
    sources: [who_gho, dhs, mohp]
    outputs: [health_financing_table, workforce_density, stunting_trend]
  - id: 10B
    name: Labour Market Researcher
    focus: Investigate employment, wages, working conditions, informality, labour productivity and social protection.
    questions:
      - What are labour-force participation, unemployment and informality rates (NLFS)?
      - What is output per worker by sector?
      - What social-protection coverage exists?
    data: [NLFS indicators, informality rate, sectoral output per worker, SP coverage]
    sources: [nso_nepal, ilostat]
    outputs: [labour_market_baseline, productivity_by_sector, sp_coverage]
  - id: 10C
    name: Population and Participation Researcher
    focus: Analyse ageing, population change, labour-force participation, migration and long-term workforce supply.
    questions:
      - What do census 2021 and UN WPP imply for working-age population to 2070?
      - When does the demographic dividend window close under each variant?
      - How large is the absent population abroad and how is it counted?
    data: [census 2021 population, absentee population, WPP variants, fertility rate]
    sources: [nso_nepal, un_wpp]
    outputs: [population_paths, working_age_share_paths, dividend_window]

- id: "11"
  slug: law-governance-institutions
  name: Law, Governance and Institutions
  division: A
  kind: specialist
  mission: >-
    Study institutional constraints and the legal requirements for effective
    development programmes.
  responsibilities:
    - Maintain a legal-constraint register used by every strategy.
  depends_on: []
  deliverables:
    - Legal and institutional constraint register
  subagents:
  - id: 11A
    name: Legal and Regulatory Researcher
    focus: Investigate contract enforcement, judicial capacity, business regulation and applicable constitutional requirements.
    questions:
      - What constitutional provisions govern economic policy, federal finance and natural resources?
      - What is the documented time and cost of contract enforcement?
      - Which laws govern FDI, land acquisition and PPPs?
    data: [constitution text, case backlog statistics, key statutes]
    sources: [lawcommission_nepal, supremecourt_nepal, wb_npl]
    outputs: [constitutional_constraints, enforcement_metrics, statute_inventory]
  - id: 11B
    name: Procurement and Integrity Researcher
    focus: Study transparent public procurement, auditing, administrative controls and mechanisms to prevent corruption.
    questions:
      - What irregularities and arrears does the Auditor General report?
      - What share of procurement is e-procured and competitive?
      - What do governance indicators show over time (with methodology caveats)?
    data: [OAG annual report figures, e-GP statistics, WGI, CPI]
    sources: [oag_nepal, ppmo, ciaa, wb_wgi, ti_cpi]
    outputs: [audit_irregularities_trend, procurement_competition, governance_indicators]
  - id: 11C
    name: Federalism and Public Administration Researcher
