# NEPAL 3T — source catalog
#
# A catalog of *where* evidence should come from. It contains NO data values.
# `tier` follows the source hierarchy in CLAUDE.md (1 = highest priority):
#   1 Nepal official (NSO, NRB, MoF, ministries, provincial authorities)
#   2 IMF / World Bank / ADB
#   3 UN system, ILO, UNCTAD, WTO
#   4 Foreign governments and central banks
#   5 IEA and energy authorities
#   6 ICIMOD and climate-science bodies
#   7 Academic research and reputable independent analysis
#
# endpoint_status: every URL below was recorded from general knowledge when the
# catalog was created and is "unverified" until an agent successfully retrieves
# a document from it and records the retrieval in the observation store.

sources:
  # ---------------- Tier 1: Nepal official ----------------
